name: Buckland open-PR integration check

on:
  push:
    branches:
      - fix/integrate-open-prs-2026-09-28

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
