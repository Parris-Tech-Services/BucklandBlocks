name: Buckland Blocks quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: buckland-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # React rules of hooks: catches hook-order crashes (React error #310).
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      # Load the built game in a real browser, press Resume, play briefly, and
      # fail on any page error, console error or missing asset.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
