name: Buckland repair verification

on:
  push:
    branches:
      - fix/gameplay-repair-2026-09-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Vite preview
        run: |
          npm exec vite -- preview --host 127.0.0.1 --port 4173 > /tmp/buckland-vite.log 2>&1 &
          echo $! > /tmp/buckland-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/buckland-vite.log
          exit 1

      - name: Browser playtest
        env:
          PLAYTEST_URL: http://127.0.0.1:4173/
        run: node scripts/buckland-playtest.mjs

      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buckland-playtest
          path: artifacts/playtest-result.json
          if-no-files-found: warn
